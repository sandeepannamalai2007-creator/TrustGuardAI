version: '3.8'

services:
  # 1. PostgreSQL Database Service (Persistent Data Store)
  db:
    image: postgres:15-alpine
    container_name: trustguard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trustguard_network
    # Production security: PostgreSQL is isolated inside trustguard_network (no exposed host ports)
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

  # 2. Redis Shared Rate Limiting Service
  redis:
    image: redis:7-alpine
    container_name: trustguard-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trustguard_network
    # Production security: Redis is isolated inside trustguard_network (no exposed host ports)
    # ports:
    #   - "6379:6379"
    restart: unless-stopped

  # 3. TrustGuard API Service (Continuous Biometric Risk Processor)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustguard-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TRUSTGUARD_ENV=${TRUSTGUARD_ENV}
      - TRUSTGUARD_JWT_SECRET=${TRUSTGUARD_JWT_SECRET}
      - TRUSTGUARD_ADMIN_PIN=${TRUSTGUARD_ADMIN_PIN}
      - TRUSTGUARD_STEP_UP_PIN=${TRUSTGUARD_STEP_UP_PIN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-2.0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ENABLE_HTTPS_REDIRECT=${ENABLE_HTTPS_REDIRECT}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - trustguard_network
    restart: unless-stopped

networks:
  trustguard_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
