name: TrustGuard AI Production Security & CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Unit Tests & Ruff Linter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Train ML Model if Artifact Missing
      run: |
        python ml/train_model.py

    - name: Lint Codebase with Ruff
      run: |
        ruff check backend/ ml/ alembic/ --ignore E501,E402

    - name: Run Pytest Suite with Coverage
      env:
        TRUSTGUARD_JWT_SECRET: "ci-test-jwt-secret-key-123456789012345"
        TRUSTGUARD_ADMIN_PIN: "123456"
        TRUSTGUARD_STEP_UP_PIN: "999999"
      run: |
        python -m pytest --cov=backend --cov-report=term-missing --verbose

  security-and-vulnerability-audit:
    name: Dependency Audit & Secret Scanning (Hard Security Gate)
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Hard Dependency Security Audit (pip-audit)
      run: |
        python -m pip install --upgrade pip pip-audit
        pip-audit -r requirements.txt

    - name: Automated Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-and-smoke-test:
    name: Production Docker Build, Hard Trivy Scan & Smoke Test
    needs: security-and-vulnerability-audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Docker Image
      run: |
        docker build -t trustguard-api:latest .

    - name: Hard Trivy Container Image Vulnerability Gate
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'trustguard-api:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Verify Non-Root User Execution
      run: |
        USER_ID=$(docker run --rm trustguard-api:latest whoami)
        echo "Container user: $USER_ID"
        if [ "$USER_ID" = "root" ]; then
          echo "FAIL: Container is running as root!"
          exit 1
        fi
        echo "PASS: Container runs as non-root user '$USER_ID'"

    - name: Run Docker Compose Environment
      env:
        TRUSTGUARD_ENV: "production"
        TRUSTGUARD_JWT_SECRET: "ci-production-jwt-secret-key-32-chars-minimum"
        TRUSTGUARD_ADMIN_PIN: "admin123456"
        TRUSTGUARD_STEP_UP_PIN: "stepup999999"
        POSTGRES_DB: "trustguard_db"
        POSTGRES_USER: "trustguard_user"
        POSTGRES_PASSWORD: "trustguard_secure_db_pass"
        DATABASE_URL: "postgresql://trustguard_user:trustguard_secure_db_pass@db:5432/trustguard_db"
        REDIS_PASSWORD: "redis_secure_pass"
        ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
        ENABLE_HTTPS_REDIRECT: "false"
        TRUSTED_PROXIES: "127.0.0.1"
      run: |
        docker compose up -d --build

    - name: Resilient Container Health Probe Verification Loop
      run: |
        echo "Polling TrustGuard API container until healthy..."
        SUCCESS=0
        for i in $(seq 1 30); do
          if curl -s -f http://localhost:8000/live > /dev/null && curl -s -f http://localhost:8000/ready > /dev/null; then
            echo "PASS: TrustGuard API containers passed /live and /ready health probes after ${i} tries!"
            SUCCESS=1
            break
          fi
          echo "Attempt ${i}/30: Containers starting, sleeping 2s..."
          sleep 2
        done

        if [ "$SUCCESS" -ne 1 ]; then
          echo "FAIL: Container health probe timed out!"
          docker compose logs
          exit 1
        fi

    - name: Teardown Compose Environment
      if: always()
      run: |
        docker compose down -v
