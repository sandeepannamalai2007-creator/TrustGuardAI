name: TrustGuard AI CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt ruff pytest-cov

    - name: Train ML Model if Artifact Missing
      run: |
        python ml/train_model.py

    - name: Lint Codebase with Ruff
      run: |
        ruff check backend/ --ignore E501,E402

    - name: Run Pytest Suite with Coverage
      env:
        TRUSTGUARD_JWT_SECRET: "ci-test-jwt-secret-key-12345"
        TRUSTGUARD_ADMIN_PIN: "1234"
        TRUSTGUARD_STEP_UP_PIN: "9999"
      run: |
        python -m pytest --cov=backend --cov-report=term-missing --verbose
